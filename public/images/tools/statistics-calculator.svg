<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" fill="none">
  <rect width="800" height="320" rx="16" fill="#0d0d14" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="60" y1="60" x2="740" y2="60" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="4 4"/>
  <line x1="60" y1="120" x2="740" y2="120" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="4 4"/>
  <line x1="60" y1="180" x2="740" y2="180" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="4 4"/>
  <line x1="60" y1="230" x2="740" y2="230" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Shaded 1-SD Region -->
  <path d="M 290 230 C 330 165, 365 75, 400 75 C 435 75, 470 165, 510 230 Z" fill="#2dd4bf" fill-opacity="0.12"/>

  <!-- Bell Curve -->
  <path d="M 90 228 C 190 226, 250 205, 290 155 C 330 105, 365 75, 400 75 C 435 75, 470 105, 510 155 C 550 205, 610 226, 710 228" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>

  <!-- Center Mean / Median / Mode Line -->
  <line x1="400" y1="65" x2="400" y2="230" stroke="#ff6b35" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="400" cy="75" r="5" fill="#ff6b35"/>

  <!-- -1s and +1s Lines -->
  <line x1="290" y1="155" x2="290" y2="230" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="510" y1="155" x2="510" y2="230" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="290" cy="155" r="4" fill="#38bdf8"/>
  <circle cx="510" cy="155" r="4" fill="#38bdf8"/>

  <!-- -2s and +2s Lines -->
  <line x1="190" y1="215" x2="190" y2="230" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="610" y1="215" x2="610" y2="230" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Axis Labels -->
  <text x="400" y="45" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="13" font-weight="bold">Mean (x̄) • Median (x̃) • Mode</text>
  <text x="400" y="252" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">x̄</text>
  <text x="290" y="252" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12">-1s (x̄ - s)</text>
  <text x="510" y="252" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12">+1s (x̄ + s)</text>
  <text x="190" y="252" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="12">-2s</text>
  <text x="610" y="252" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="12">+2s</text>

  <!-- Dispersion Span Arrow -->
  <line x1="298" y1="190" x2="502" y2="190" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="400" y="182" text-anchor="middle" fill="#2dd4bf" font-family="monospace" font-size="11" font-weight="bold">±1 Standard Deviation (~68.2% of data)</text>

  <!-- Formula Cards Footer -->
  <rect x="60" y="268" width="210" height="36" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="165" y="290" text-anchor="middle" fill="#e4e4e7" font-family="monospace" font-size="12">Mean: x̄ = Σxᵢ / N</text>

  <rect x="295" y="268" width="210" height="36" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="400" y="290" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12">Sample Var: s² = Σ(xᵢ-x̄)²/(N-1)</text>

  <rect x="530" y="268" width="210" height="36" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="635" y="290" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="12">Std Dev: s = √s²  |  σ = √σ²</text>
</svg>

